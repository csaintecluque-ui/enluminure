<body>
<div id="app">
  <header id="topbar">
    <div class="brand" title="Enluminure"><span id="brand-logo" class="brand-logo"></span><span class="brand-name">Enluminure</span></div>
    <button id="btn-menu" class="btn small mobile-only" type="button" aria-label="Menus">Menus ▾</button>
    <nav id="menubar" aria-label="Menus"></nav>
    <div class="top-actions">
      <button id="btn-undo" class="icon-btn" type="button" title="Annuler (Ctrl+Z)" aria-label="Annuler"></button>
      <button id="btn-redo" class="icon-btn" type="button" title="Rétablir (Ctrl+Maj+Z)" aria-label="Rétablir"></button>
      <button class="icon-btn panel-toggle mobile-only" type="button" data-panel="layers" title="Calques" aria-label="Calques"></button>
      <button class="icon-btn panel-toggle mobile-only" type="button" data-panel="history" title="Historique" aria-label="Historique"></button>
    </div>
  </header>

  <div id="optionsbar"></div>

  <div id="main">
    <aside id="toolbar" aria-label="Outils"></aside>

    <section id="center">
      <div id="tabs" class="no-tabs"></div>
      <div id="workspace">
        <canvas id="view"></canvas>
        <div id="welcome">
          <img class="welcome-seal" src="icons/sceau-enluminure.svg" alt="" width="132" height="132">
          <h1>Enluminure</h1>
          <p class="muted">L'atelier d'images — tout reste sur votre appareil.</p>
          <div class="welcome-actions">
            <button id="w-new" type="button" class="btn primary big">Nouveau document</button>
            <button id="w-open" type="button" class="btn big">Ouvrir une image</button>
          </div>
          <p class="muted small">JPG, PNG, WebP, GIF, PSD… Vous pouvez aussi glisser une image ici ou la coller (Ctrl+V).</p>
        </div>
        <div id="dropmask"><div>Déposez pour ouvrir — ou pour ajouter comme calque</div></div>
      </div>
    </section>

    <aside id="panels" data-show="layers">
      <section class="panel" id="panel-layers">
        <header class="panel-head"><h3>Calques</h3><button class="icon-btn panel-close mobile-only" type="button" aria-label="Fermer"></button></header>
        <div class="layer-props">
          <select id="layer-blend" title="Mode de fusion" aria-label="Mode de fusion"></select>
          <label class="opacity" title="Opacité">
            <span>Opacité</span>
            <input id="layer-opacity" type="range" min="0" max="100" value="100" aria-label="Opacité">
            <input id="layer-opacity-num" type="number" min="0" max="100" value="100" inputmode="numeric" aria-label="Opacité en %"><span>%</span>
          </label>
        </div>
        <div id="layers-list"></div>
        <footer id="layers-foot"></footer>
      </section>
      <section class="panel" id="panel-history">
        <header class="panel-head"><h3>Historique</h3><button class="icon-btn panel-close mobile-only" type="button" aria-label="Fermer"></button></header>
        <div id="history-list"></div>
        <footer id="history-info" class="muted small"></footer>
      </section>
    </aside>
  </div>

  <footer id="statusbar">
    <input id="st-zoom" type="text" aria-label="Zoom" spellcheck="false">
    <span id="st-size"></span>
    <span id="st-layers"></span>
    <span id="st-cursor"></span>
    <span class="st-spacer"></span>
    <span class="st-brand">Enluminure <span id="version"></span> · Anamnesis · CSC</span>
  </footer>
</div>

<div id="busy" hidden><div class="spinner"></div><span id="busy-msg">Un instant…</span></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<input type="file" id="file-open" accept="image/*,.psd,.psb,image/vnd.adobe.photoshop" multiple hidden>
<input type="file" id="file-import" accept="image/*" multiple hidden>
<input type="color" id="color-input" class="vh" tabindex="-1" aria-hidden="true">

<script type="module" src="js/main.js"></script>
<script>
// Filet de sécurité : si l'appli n'a pas démarré (mise à jour à moitié téléchargée, connexion coupée…), on le dit et on propose de recharger proprement.
(function () {
  function fail() {
    if (window.enluminure || document.getElementById('boot-fail')) return;
    var d = document.createElement('div');
    d.id = 'boot-fail';
    d.style.cssText = 'position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#1b1512;color:#ead9b8;font:16px system-ui,sans-serif;text-align:center;padding:24px';
    d.innerHTML = '<div><p style="font-size:20px;margin:0 0 10px">Enluminure n\u2019a pas pu d\u00e9marrer.</p><p style="color:#a8988a;margin:0 0 18px">Une mise \u00e0 jour est peut-\u00eatre en cours, ou la connexion a \u00e9t\u00e9 coup\u00e9e.</p><button id="boot-reload" style="font:inherit;padding:10px 18px;border-radius:8px;border:0;background:#c9804f;color:#1b1512;cursor:pointer">Recharger l\u2019appli</button></div>';
    document.body.appendChild(d);
    document.getElementById('boot-reload').onclick = function () {
      var done = function () { location.reload(); };
      try {
        Promise.all([
          navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }) : null,
          window.caches ? caches.keys().then(function (k) { return Promise.all(k.filter(function (n) { return n.indexOf('enluminure-') === 0; }).map(function (n) { return caches.delete(n); })); }) : null
        ]).then(done, done);
      } catch (e) { done(); }
    };
  }
  window.addEventListener('load', function () { setTimeout(fail, 6000); });
})();
</script>
</body>
